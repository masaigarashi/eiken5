<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英検5級 単語カード</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap');

:root {
  --bg: #F5F2ED;
  --surface: #FFFFFF;
  --surface2: #F0EDE8;
  --border: #E2DDD7;
  --text-primary: #1A1714;
  --text-secondary: #6B6560;
  --text-muted: #A09890;
  --accent: #2D5A3D;
  --accent-light: #E8F0EA;
  --red: #C0392B;
  --red-light: #FDECEA;
  --green: #27AE60;
  --green-light: #E9F7EF;
  --flag: #E67E22;
  --flag-light: #FEF5E7;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text-primary);
  padding: 24px 16px 40px;
}

.app { max-width: 480px; margin: 0 auto; }

.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 24px;
}
.header-title { font-family: 'DM Serif Display', serif; font-size: 1.6rem; color: var(--text-primary); line-height: 1; }
.header-sub { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
.flag-count-btn {
  font-size: 0.75rem; font-weight: 700; color: var(--flag);
  background: var(--flag-light); padding: 5px 12px; border-radius: 20px;
  cursor: pointer; border: 1.5px solid transparent; transition: all 0.2s; user-select: none;
}
.flag-count-btn.active { background: var(--flag); color: white; }
.flag-count-btn:hover { opacity: 0.85; }

.mode-tabs { display: flex; gap: 6px; background: var(--surface2); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
.mode-tab {
  flex: 1; padding: 8px; border: none; border-radius: 9px; background: transparent;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif; font-size: 0.78rem; font-weight: 600;
  color: var(--text-secondary); cursor: pointer; transition: all 0.2s;
}
.mode-tab.active { background: var(--surface); color: var(--accent); box-shadow: var(--shadow); }

.filter-wrap { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
.filter-wrap::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1.5px solid var(--border);
  background: var(--surface); font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: all 0.2s;
}
.cat-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

.progress-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-label { font-size: 0.72rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.06em; }
.progress-nums { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); }
.progress-track { height: 3px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.5s ease; }

.score-row { display: flex; gap: 8px; margin-bottom: 18px; }
.score-chip { flex: 1; padding: 10px 8px; border-radius: 10px; text-align: center; }
.score-chip.ok { background: var(--green-light); }
.score-chip.ng { background: var(--red-light); }
.score-chip.flagged { background: var(--flag-light); }
.score-num { font-family: 'DM Serif Display', serif; font-size: 1.5rem; line-height: 1; }
.score-chip.ok .score-num { color: var(--green); }
.score-chip.ng .score-num { color: var(--red); }
.score-chip.flagged .score-num { color: var(--flag); }
.score-lbl { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px; }

/* Card */
.card-scene { perspective: 1200px; margin-bottom: 14px; }
.card-body {
  position: relative;
  height: 260px;
  transform-style: preserve-3d;
  transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}
.card-scene.flipped .card-body { transform: rotateY(180deg); }
.card-face {
  position: absolute; inset: 0; backface-visibility: hidden; border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px 28px; background: var(--surface); border: 1.5px solid var(--border); box-shadow: var(--shadow-lg);
}
.card-back-face { transform: rotateY(180deg); }

.card-meta { position: absolute; top: 16px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 18px; }
.card-meta-cat { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); }
.card-meta-num { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); }

.card-flag-dot { position: absolute; bottom: 14px; right: 16px; font-size: 0.75rem; color: var(--flag); opacity: 0; transition: opacity 0.3s; }
.card-flag-dot.on { opacity: 1; }

/* Front — word only, no tap hint now */
.card-word { font-family: 'DM Serif Display', serif; font-size: 3.2rem; color: var(--text-primary); text-align: center; line-height: 1.1; }

/* Back */
.card-emoji { font-size: 2.6rem; margin-bottom: 8px; }
.card-meaning { font-family: 'DM Serif Display', serif; font-size: 2rem; color: var(--accent); text-align: center; margin-bottom: 10px; line-height: 1.2; }
.card-example { font-size: 0.78rem; font-style: italic; color: var(--text-secondary); text-align: center; line-height: 1.6; font-weight: 500; }

/* Speak button on back */
.speak-btn {
  position: absolute; bottom: 14px; left: 16px;
  background: var(--accent-light); border: none; border-radius: 20px;
  padding: 4px 10px; font-size: 0.7rem; font-weight: 700;
  color: var(--accent); cursor: pointer; transition: background 0.2s;
  display: flex; align-items: center; gap: 4px;
}
.speak-btn:hover { background: #d0e6d8; }

/* Main action buttons — shown on FRONT */
.action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.act-btn {
  padding: 15px;
  border: none; border-radius: 13px;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  transition: all 0.15s; letter-spacing: 0.02em;
}
.act-btn:active { transform: scale(0.97); }
.act-btn.ok { background: var(--green-light); color: var(--green); }
.act-btn.ok:hover { background: #D5F5E3; }
.act-btn.ng { background: var(--red-light); color: var(--red); }
.act-btn.ng:hover { background: #FADBD8; }

/* After NG — next button appears */
.next-btn {
  width: 100%; padding: 14px; border: none; border-radius: 13px;
  background: var(--accent); color: white;
  font-family: 'DM Sans', 'Noto Sans JP', sans-serif;
  font-size: 0.88rem; font-weight: 700; cursor: pointer;
  transition: opacity 0.2s; margin-bottom: 8px; letter-spacing: 0.03em;
}
.next-btn:hover { opacity: 0.88; }

.shuffle-btn {
  width: 100%; padding: 10px; border: 1.5px solid var(--border); border-radius: 11px;
  background: transparent; color: var(--text-secondary);
  font-family: 'DM Sans', sans-serif; font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: background 0.2s;
}
.shuffle-btn:hover { background: var(--surface2); }

/* Flag drawer */
.flag-drawer { margin-top: 18px; background: var(--surface); border: 1.5px solid var(--border); border-radius: 16px; overflow: hidden; display: none; }
.flag-drawer.open { display: block; }
.flag-drawer-header { padding: 13px 18px; background: var(--flag-light); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.flag-drawer-title { font-size: 0.78rem; font-weight: 700; color: var(--flag); letter-spacing: 0.05em; text-transform: uppercase; }
.flag-clear-btn { font-size: 0.7rem; font-weight: 700; color: var(--red); background: none; border: none; cursor: pointer; padding: 2px 8px; border-radius: 6px; }
.flag-clear-btn:hover { background: var(--red-light); }
.flag-list { max-height: 220px; overflow-y: auto; }
.flag-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 18px; border-bottom: 1px solid var(--border); gap: 12px; }
.flag-item:last-child { border-bottom: none; }
.flag-word { font-family: 'DM Serif Display', serif; font-size: 1rem; color: var(--text-primary); }
.flag-meaning { font-size: 0.75rem; color: var(--text-secondary); font-weight: 500; }
.flag-remove { font-size: 0.68rem; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
.flag-remove:hover { color: var(--red); background: var(--red-light); }
.flag-empty { padding: 20px; text-align: center; font-size: 0.8rem; color: var(--text-muted); font-weight: 600; }

/* Complete */
.complete-panel { display: none; background: var(--surface); border-radius: 18px; padding: 36px 26px; text-align: center; border: 1.5px solid var(--border); box-shadow: var(--shadow-lg); animation: fadeUp 0.4s ease; }
.complete-panel.show { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.complete-icon { width: 56px; height: 56px; background: var(--accent-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; margin: 0 auto 14px; }
.complete-title { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--text-primary); margin-bottom: 4px; }
.complete-sub { font-size: 0.8rem; color: var(--text-secondary); font-weight: 500; margin-bottom: 20px; }
.complete-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
.c-stat { padding: 12px 8px; border-radius: 12px; background: var(--surface2); }
.c-stat-num { font-family: 'DM Serif Display', serif; font-size: 1.5rem; }
.c-stat-lbl { font-size: 0.62rem; font-weight: 700; color: var(--text-muted); letter-spacing: 0.05em; text-transform: uppercase; }
.restart-btn { width: 100%; padding: 13px; border: none; border-radius: 13px; background: var(--accent); color: white; font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.88rem; cursor: pointer; margin-bottom: 8px; transition: opacity 0.2s; }
.restart-btn:hover { opacity: 0.88; }
.review-only-btn { width: 100%; padding: 12px; border: 1.5px solid var(--flag); border-radius: 13px; background: var(--flag-light); color: var(--flag); font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.82rem; cursor: pointer; transition: opacity 0.2s; }
.review-only-btn:hover { opacity: 0.88; }

/* Toast */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(70px); background: var(--text-primary); color: white; padding: 9px 20px; border-radius: 30px; font-size: 0.8rem; font-weight: 700; transition: transform 0.35s cubic-bezier(0.23,1,0.32,1); z-index: 100; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.ok-t { background: var(--green); }
.toast.ng-t { background: var(--flag); }

/* OK counter pop animation */
@keyframes okPop {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.35); }
  70%  { transform: scale(0.92); }
  100% { transform: scale(1); }
}
@keyframes screenFlash {
  0%   { opacity: 0; }
  20%  { opacity: 0.18; }
  100% { opacity: 0; }
}
.ok-pop { animation: okPop 0.45s cubic-bezier(0.23,1,0.32,1) forwards; }
#screenFlash {
  position: fixed; inset: 0; pointer-events: none; z-index: 998;
  background: radial-gradient(circle at center, #a8edca 0%, transparent 70%);
  opacity: 0;
}
</style>
</head>
<body>
<div class="app">

  <div id="screenFlash"></div>
  <!-- Particle canvas — full screen, behind everything -->
  <canvas id="particleCanvas" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:999"></canvas>

  <div class="header">
    <div>
      <div class="header-title">英検5級</div>
      <div class="header-sub">Grade 5 Vocabulary</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
      <!-- Big OK counter -->
      <div id="okCounter" style="
        display:flex;align-items:baseline;gap:4px;
        background:var(--green-light);border-radius:16px;
        padding:6px 14px;border:2px solid #B7E4C7;
        transition:transform 0.15s;
      ">
        <span style="font-family:'DM Serif Display',serif;font-size:2rem;line-height:1;color:var(--green)" id="okBig">0</span>
        <span style="font-size:0.65rem;font-weight:700;color:var(--green);letter-spacing:0.05em">わかった</span>
      </div>
      <div class="flag-count-btn" id="flagBtn" onclick="toggleDrawer()">🔖 要復習 <span id="flagNum">0</span>語</div>
    </div>
  </div>

  <!-- Level selector -->
  <div class="mode-tabs" id="levelTabs">
    <button class="mode-tab active" id="lvAll" onclick="setLevel('all')">すべて</button>
    <button class="mode-tab" id="lv1" onclick="setLevel('初級')">🟢 初級</button>
    <button class="mode-tab" id="lv2" onclick="setLevel('中級')">🔵 中級</button>
    <button class="mode-tab" id="lv3" onclick="setLevel('上級')">🟣 上級</button>
  </div>
  <!-- Review mode toggle -->
  <div class="mode-tabs" style="margin-top:-8px">
    <button class="mode-tab active" id="tabAll" onclick="setMode('all')">すべての単語</button>
    <button class="mode-tab" id="tabReview" onclick="setMode('review')">🔖 要復習のみ</button>
  </div>

  <div class="filter-wrap" id="filterWrap"></div>

  <div class="progress-row">
    <span class="progress-label">Progress</span>
    <span class="progress-nums" id="progressNums">0 / 0</span>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

  <div class="score-row">
    <div class="score-chip ok"><div class="score-num" id="sOk">0</div><div class="score-lbl">わかった</div></div>
    <div class="score-chip ng"><div class="score-num" id="sNg">0</div><div class="score-lbl">わからない</div></div>
    <div class="score-chip flagged"><div class="score-num" id="sFlag">0</div><div class="score-lbl">要復習</div></div>
  </div>

  <!-- Card -->
  <div class="card-scene" id="cardScene">
    <div class="card-body" id="cardBody">

      <div class="card-face" id="cFront">
        <div class="card-meta">
          <span class="card-meta-cat" id="fCat">—</span>
          <span class="card-meta-num" id="fNum">1 / 1</span>
        </div>
        <div class="card-word" id="cardWord">apple</div>
        <span class="card-flag-dot" id="flagDot">🔖</span>
      </div>

      <div class="card-face card-back-face" id="cBack">
        <div class="card-meta">
          <span class="card-meta-cat" id="bCat">—</span>
          <span class="card-meta-num" id="bNum">1 / 1</span>
        </div>
        <div style="position:absolute;top:14px;right:50%;transform:translateX(50%);font-size:0.65rem;font-weight:700;color:var(--text-muted)" id="levelBadge"></div>
        <div class="card-emoji" id="cardEmoji">🍎</div>
        <div class="card-meaning" id="cardMeaning">りんご</div>
        <div class="card-example" id="cardExample">I eat an apple.</div>
        <button class="speak-btn" onclick="speakWord(event)">🔊 もう一度聞く</button>
        <span class="card-flag-dot on" id="flagDotBack" style="opacity:0">🔖</span>
      </div>

    </div>
  </div>

  <!-- Buttons: わかった / わからない — always visible on front state -->
  <div class="action-btns" id="actionBtns">
    <button class="act-btn ng" onclick="answerNG()">✗ わからない</button>
    <button class="act-btn ok" onclick="answerOK()">✓ わかった！</button>
  </div>

  <!-- Next button — shown after NG (answer revealed) -->
  <button class="next-btn" id="nextBtn" onclick="nextCard()" style="display:none">次へ →</button>

  <button class="shuffle-btn" onclick="shuffleCards()">シャッフル</button>

  <!-- Complete panel -->
  <div class="complete-panel" id="completePanel">
    <div class="complete-icon">🎓</div>
    <div class="complete-title">Complete!</div>
    <div class="complete-sub" id="cSub">お疲れ様でした</div>
    <div class="complete-grid">
      <div class="c-stat"><div class="c-stat-num" id="cOk" style="color:var(--green)">0</div><div class="c-stat-lbl">わかった</div></div>
      <div class="c-stat"><div class="c-stat-num" id="cNg" style="color:var(--red)">0</div><div class="c-stat-lbl">わからない</div></div>
      <div class="c-stat"><div class="c-stat-num" id="cFlag" style="color:var(--flag)">0</div><div class="c-stat-lbl">要復習</div></div>
    </div>
    <button class="restart-btn" onclick="restart()">もう一度</button>
    <button class="review-only-btn" id="reviewBtn" onclick="startReviewOnly()" style="margin-top:8px;display:none">🔖 要復習のみ練習する</button>
  </div>

  <!-- Flag drawer -->
  <div class="flag-drawer" id="flagDrawer">
    <div class="flag-drawer-header">
      <span class="flag-drawer-title">🔖 要復習リスト</span>
      <button class="flag-clear-btn" onclick="clearAllFlags()">すべてクリア</button>
    </div>
    <div class="flag-list" id="flagList"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
// ── Audio ──────────────────────────────────────────────
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playPingPong() {
  try {
    const ctx = getAudioCtx();
    const notes = [880, 1174.66]; // A5, D6 — ピンポン
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + i * 0.18;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.35, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
      osc.start(t); osc.stop(t + 0.3);
    });
  } catch(e) { console.warn('audio error', e); }
}

function playBuzz() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.value = 160;
    const t = ctx.currentTime;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(0.25, t + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    osc.start(t); osc.stop(t + 0.4);
  } catch(e) { console.warn('audio error', e); }
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'en-US';
  utt.rate = 0.85;
  // Try to pick a natural English voice
  const voices = window.speechSynthesis.getVoices();
  const en = voices.find(v => v.lang.startsWith('en') && v.localService) || voices.find(v => v.lang.startsWith('en'));
  if (en) utt.voice = en;
  window.speechSynthesis.speak(utt);
}

// Preload voices
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

// ── Data ──────────────────────────────────────────────
const wordData = {
  "初級": [
    {word:"zero",meaning:"0",emoji:"🔢",category:"数字",level:"初級"},
    {word:"one",meaning:"1",emoji:"🔢",category:"数字",level:"初級"},
    {word:"two",meaning:"2",emoji:"🔢",category:"数字",level:"初級"},
    {word:"three",meaning:"3",emoji:"🔢",category:"数字",level:"初級"},
    {word:"four",meaning:"4",emoji:"🔢",category:"数字",level:"初級"},
    {word:"five",meaning:"5",emoji:"🔢",category:"数字",level:"初級"},
    {word:"six",meaning:"6",emoji:"🔢",category:"数字",level:"初級"},
    {word:"seven",meaning:"7",emoji:"🔢",category:"数字",level:"初級"},
    {word:"eight",meaning:"8",emoji:"🔢",category:"数字",level:"初級"},
    {word:"nine",meaning:"9",emoji:"🔢",category:"数字",level:"初級"},
    {word:"ten",meaning:"10",emoji:"🔢",category:"数字",level:"初級"},
    {word:"eleven",meaning:"11",emoji:"🔢",category:"数字",level:"初級"},
    {word:"twelve",meaning:"12",emoji:"🔢",category:"数字",level:"初級"},
    {word:"twenty",meaning:"20",emoji:"🔢",category:"数字",level:"初級"},
    {word:"hundred",meaning:"100",emoji:"🔢",category:"数字",level:"初級"},
    {word:"red",meaning:"赤",emoji:"🎨",category:"色",level:"初級"},
    {word:"blue",meaning:"青",emoji:"🎨",category:"色",level:"初級"},
    {word:"green",meaning:"緑",emoji:"🎨",category:"色",level:"初級"},
    {word:"yellow",meaning:"黄色",emoji:"🎨",category:"色",level:"初級"},
    {word:"white",meaning:"白",emoji:"🎨",category:"色",level:"初級"},

// ── Storage ───────────────────────────────────────────
const SK = 'eiken5_flags_v1';
let flagged = new Set();
try { flagged = new Set(JSON.parse(localStorage.getItem(SK)) || []); } catch {}
function saveFlags() { try { localStorage.setItem(SK, JSON.stringify([...flagged])); } catch {} }

// ── State ────────────────────────────────────────────
let currentWords = [];
let currentIndex = 0;
let okCount = 0, ngCount = 0;
let mode = 'all';
let currentCat = 'すべて';
let currentLevel = 'all';
let waitingNext = false; // true after NG answer shown

const categories = ['すべて', ...new Set(words.map(w => w.category))];

// ── Build category filters ────────────────────────────
function buildFilters() {
  const wrap = document.getElementById('filterWrap');
  wrap.innerHTML = '';
  const levelWords = currentLevel === 'all' ? words : words.filter(w => w.level === currentLevel);
  const presentCats = new Set(levelWords.map(w => w.category));
  const visibleCats = ['すべて', ...categories.slice(1).filter(c => presentCats.has(c))];
  if (currentCat !== 'すべて' && !presentCats.has(currentCat)) currentCat = 'すべて';
  visibleCats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'cat-btn' + (cat === currentCat ? ' active' : '');
    btn.textContent = cat; btn.dataset.cat = cat;
    btn.onclick = () => {
      currentCat = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
      resetSession();
    };
    wrap.appendChild(btn);
  });
}

function setLevel(lv) {
  currentLevel = lv;
  ['lvAll','lv1','lv2','lv3'].forEach(id => document.getElementById(id).classList.remove('active'));
  const map = {'all':'lvAll','初級':'lv1','中級':'lv2','上級':'lv3'};
  document.getElementById(map[lv]).classList.add('active');
  currentCat = 'すべて';
  buildFilters();
  resetSession();
}

function setMode(m) {
  mode = m;
  document.getElementById('tabAll').classList.toggle('active', m === 'all');
  document.getElementById('tabReview').classList.toggle('active', m === 'review');
  resetSession();
}

function getList() {
  let list = [...words];
  if (currentLevel !== 'all') list = list.filter(w => w.level === currentLevel);
  if (currentCat !== 'すべて') list = list.filter(w => w.category === currentCat);
  if (mode === 'review') list = list.filter(w => flagged.has(w.word));
  return list;
}

// ── Session ───────────────────────────────────────────
function resetSession() {
  currentWords = getList();
  currentIndex = 0; okCount = 0; ngCount = 0; waitingNext = false;
  document.getElementById('cardScene').style.display = 'block';
  document.getElementById('actionBtns').style.display = 'grid';
  document.getElementById('nextBtn').style.display = 'none';
  document.getElementById('completePanel').classList.remove('show');
  document.getElementById('cardScene').classList.remove('flipped');
  updateChips(); updateFlagUI();
  if (currentWords.length === 0) { showEmpty(); return; }
  showCard(); updateProgress();
}

function showEmpty() {
  document.getElementById('cardScene').style.display = 'none';
  document.getElementById('actionBtns').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  const p = document.getElementById('completePanel');
  p.classList.add('show');
  document.getElementById('cSub').textContent = '要復習の単語がありません';
  document.getElementById('cOk').textContent = '—';
  document.getElementById('cNg').textContent = '—';
  document.getElementById('cFlag').textContent = flagged.size;
  document.getElementById('reviewBtn').style.display = 'none';
}

function showCard() {
  const w = currentWords[currentIndex];
  document.getElementById('cardWord').textContent = w.word;
  document.getElementById('cardEmoji').textContent = w.emoji;
  document.getElementById('cardMeaning').textContent = w.meaning;
  document.getElementById('cardExample').textContent = w.example;
  const n = (currentIndex + 1) + ' / ' + currentWords.length;
  document.getElementById('fCat').textContent = w.category;
  document.getElementById('bCat').textContent = w.category;
  document.getElementById('fNum').textContent = n;
  document.getElementById('bNum').textContent = n;
  const lvMap = {'初級':'🟢 初級','中級':'🔵 中級','上級':'🟣 上級'};
  document.getElementById('levelBadge').textContent = lvMap[w.level] || '';
  document.getElementById('flagDot').classList.toggle('on', flagged.has(w.word));
  document.getElementById('flagDotBack').style.opacity = flagged.has(w.word) ? '1' : '0';
  waitingNext = false;
  document.getElementById('cardScene').classList.remove('flipped');
  document.getElementById('actionBtns').style.display = 'grid';
  document.getElementById('nextBtn').style.display = 'none';
}

// ── Answer handlers ───────────────────────────────────
function answerOK() {
  if (waitingNext) return;
  okCount++;
  playPingPong();
  updateChips();
  triggerOKEffects();
  // Skip to next immediately
  currentIndex++;
  if (currentIndex >= currentWords.length) { showComplete(); return; }
  setTimeout(() => { showCard(); updateProgress(); }, 320);
}

function triggerOKEffects() {
  // 1. Counter pop
  const ctr = document.getElementById('okCounter');
  ctr.classList.remove('ok-pop');
  void ctr.offsetWidth;
  ctr.classList.add('ok-pop');
  setTimeout(() => ctr.classList.remove('ok-pop'), 500);

  // 2. Screen flash
  const flash = document.getElementById('screenFlash');
  flash.style.animation = 'none';
  void flash.offsetWidth;
  flash.style.animation = 'screenFlash 0.55s ease-out forwards';

  // 3. Burst particles from card
  const card = document.getElementById('cardScene');
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  burstParticles(cx, cy, okCount);
}

function answerNG() {
  if (waitingNext) return;
  waitingNext = true;
  ngCount++;
  const w = currentWords[currentIndex];
  flagged.add(w.word); saveFlags();
  playBuzz();
  updateChips(); updateFlagUI();
  // Flip card to reveal answer
  document.getElementById('cardScene').classList.add('flipped');
  document.getElementById('actionBtns').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'block';
  document.getElementById('flagDotBack').style.opacity = '1';
  // Read aloud after flip animation
  setTimeout(() => speak(w.word), 500);
  showToast('🔖 要復習に追加', 'ng-t');
}

function nextCard() {
  currentIndex++;
  if (currentIndex >= currentWords.length) { showComplete(); return; }
  showCard(); updateProgress();
}

function speakWord(e) {
  e.stopPropagation();
  const w = currentWords[currentIndex];
  if (w) speak(w.word);
}

  const total = currentWords.length;

  document.getElementById('completePanel').classList.remove('show');

  document.getElementById('tabReview').classList.add('active');

function shuffleCards() {
  currentWords = getList();
  for (let i = currentWords.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [currentWords[i], currentWords[j]] = [currentWords[j], currentWords[i]];
  }
  currentIndex = 0; okCount = 0; ngCount = 0; waitingNext = false;
  document.getElementById('completePanel').classList.remove('show');
  document.getElementById('cardScene').style.display = 'block';
  document.getElementById('cardScene').classList.remove('flipped');
  document.getElementById('actionBtns').style.display = 'grid';
  document.getElementById('nextBtn').style.display = 'none';
  updateChips(); showCard(); updateProgress();
  showToast('シャッフルしました', '');
}

  if (!confirm('要復習リストをすべてクリアしますか？')) return;

// ── Particle system ──────────────────────────────────
const canvas = document.getElementById('particleCanvas');
const ctx2d = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const COLORS = ['#27AE60','#F1C40F','#E67E22','#3498DB','#E91E63','#9B59B6','#1ABC9C','#FF5722'];
const SHAPES = ['circle','star','rect'];

function burstParticles(cx, cy, totalOk) {
  // More particles / bigger burst as streak grows
  const count = Math.min(14 + Math.floor(totalOk / 5) * 2, 40);
  const speed = 6 + Math.min(totalOk * 0.4, 8);
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.6;
    const v = speed * (0.6 + Math.random() * 0.8);
    const size = 6 + Math.random() * 10;
    particles.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * v,
      vy: Math.sin(angle) * v - 2,
      size,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      shape: SHAPES[Math.floor(Math.random() * SHAPES.length)],
      alpha: 1,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.3,
      life: 1,
      decay: 0.018 + Math.random() * 0.014,
    });
  }
}

function drawStar(ctx, x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = (Math.PI * 2 / 5) * i - Math.PI / 2;
    const b = a + Math.PI / 5;
    ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    ctx.lineTo(x + Math.cos(b) * r * 0.45, y + Math.sin(b) * r * 0.45);
  }
  ctx.closePath();
  ctx.fill();
}

function animateParticles() {
  ctx2d.clearRect(0, 0, canvas.width, canvas.height);
  particles = particles.filter(p => p.life > 0);
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.35; // gravity
    p.vx *= 0.97;
    p.rot += p.rotSpeed;
    p.life -= p.decay;
    p.alpha = Math.max(0, p.life);
    ctx2d.save();
    ctx2d.globalAlpha = p.alpha;
    ctx2d.fillStyle = p.color;
    ctx2d.translate(p.x, p.y);
    ctx2d.rotate(p.rot);
    if (p.shape === 'circle') {
      ctx2d.beginPath();
      ctx2d.arc(0, 0, p.size / 2, 0, Math.PI * 2);
      ctx2d.fill();
    } else if (p.shape === 'rect') {
      ctx2d.fillRect(-p.size / 2, -p.size / 3, p.size, p.size * 0.6);
    } else {
      drawStar(ctx2d, 0, 0, p.size / 2);
    }
    ctx2d.restore();
  }
  requestAnimationFrame(animateParticles);
}
animateParticles();

// ── Init ──────────────────────────────────────────────
buildFilters();
resetSession();
</script>
